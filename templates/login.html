<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود | سامانه پلاک‌خوان دیجی‌اکسپرس</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <main class="auth-shell">
    <section class="panel auth-panel">
      <div class="login-brand">
        <img src="/static/branding/digiexpress-login-logo.svg" alt="DigiExpress">
      </div>
      <h1>سامانه پلاک‌خوان دیجی‌اکسپرس</h1>
      <p class="muted">License Plate Recognition System</p>

      <h2>ورود به سامانه</h2>
      <p class="muted">ورود با ایمیل سازمانی و رمز عبور شما</p>

      {% if error %}
        <div class="alert">{{ error }}</div>
      {% endif %}

      <form method="post" class="form login-form">
        <label>ایمیل سازمانی</label>
        <input name="username" autocomplete="username" placeholder="user@digikala.com" required>

        <label>رمز عبور</label>
        <input name="password" type="password" autocomplete="current-password" required>

        <button class="button" type="submit">ورود</button>
      </form>

      <div class="login-footer">Designed by DigiExpress Infrastructure</div>
    </section>
  </main>
</body>
</html>
