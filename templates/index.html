{% extends 'base.html' %}
{% block content %}
<section class="hero">
  <div>
    <h2>Live Access Dashboard</h2>
    <p>Monitor entries, exits, vehicle records, and alerts by site.</p>
  </div>
  <div class="actions">
    <a class="button" href="/mobile-entry">Open Mobile Entry</a>
    <a class="button secondary" href="/settings/sites">Manage Sites</a>
  </div>
</section>

<section class="panel">
  <label>Dashboard Site</label>
  <select id="siteFilter">
    <option value="">All Sites</option>
    {% for s in sites %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
  </select>
</section>

<section class="cards" id="stats">
  <div class="card"><span>Total Traffic</span><strong id="total">-</strong></div>
  <div class="card"><span>Entries</span><strong id="entries">-</strong></div>
  <div class="card"><span>Exits</span><strong id="exits">-</strong></div>
  <div class="card"><span>Vehicles</span><strong id="vehicles">-</strong></div>
</section>

<section class="grid2">
  <div class="panel">
    <h3>Latest Traffic</h3>
    <div id="latest">Loading...</div>
  </div>
  <div class="panel small-panel">
    <h3>Alerts</h3>
    <div id="alerts">Loading...</div>
  </div>
</section>

<script>
async function loadStats(){
  const siteId = document.getElementById('siteFilter').value;
  const url = siteId ? `/api/dashboard-stats?site_id=${encodeURIComponent(siteId)}` : '/api/dashboard-stats';
  const r = await fetch(url);
  const d = await r.json();
  document.getElementById('total').textContent = d.today.total || 0;
  document.getElementById('entries').textContent = d.today.entries || 0;
  document.getElementById('exits').textContent = d.today.exits || 0;
  document.getElementById('vehicles').textContent = d.vehicles.total || 0;
  document.getElementById('latest').innerHTML = (d.latest || []).map(x => `<div class="row"><b>${x.plate || '-'}</b><span>${x.site_name || '-'}</span><span>${x.gate_role || '-'}</span><span>${x.source || '-'}</span></div>`).join('') || 'No traffic yet';
  document.getElementById('alerts').innerHTML = (d.alerts || []).map(x => `<div class="alert"><b>${x.plate || '-'}</b><span>${x.site_name || '-'}</span><span>${x.status || 'unknown'}</span></div>`).join('') || 'No alerts';
}
document.getElementById('siteFilter').addEventListener('change', loadStats);
loadStats(); setInterval(loadStats, 10000);
</script>
{% endblock %}
